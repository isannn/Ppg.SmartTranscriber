name: smarttranscriber

services:
  app:
    build:
      context: .
      dockerfile: src/SmartTranscriber.Api/Dockerfile
    container_name: smarttranscriber-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8460:8460"
    environment:
      ASPNETCORE_URLS: "http://+:8460"
      SmartTranscriber__ConnectionString: "${SMARTTRANSCRIBER__ConnectionString}"
      SmartTranscriber__Minio__Endpoint: "http://s3:9000"
      SmartTranscriber__Minio__AccessKey: "${S3_ACCESS_KEY:-minioadmin}"
      SmartTranscriber__Minio__SecretKey: "${S3_SECRET_KEY:-minioadmin}"
      SmartTranscriber__Stt__SidecarUrl: "http://stt-svc:8461"
    depends_on:
      s3:
        condition: service_healthy
    volumes:
      - ./smarttranscriber.json:/app/smarttranscriber.json:ro
    networks:
      - smarttranscriber

  stt-svc:
    build:
      context: tools/stt_svc
    container_name: smarttranscriber-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8461:8461"
    environment:
      STT_HOST: "0.0.0.0"
      STT_PORT: "8461"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - smarttranscriber

  # S3-compatible object storage. rustfs is a MinIO-protocol-compatible
  # drop-in (minio/* images are gated on Docker Hub/Quay/GHCR).
  s3:
    image: rustfs/rustfs:latest
    container_name: smarttranscriber-s3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8463:9000"   # S3 API
      - "127.0.0.1:8462:9001"   # Console
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/ -o /dev/null || curl -s http://localhost:9000/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smarttranscriber

networks:
  smarttranscriber:
    name: smarttranscriber_network

volumes:
  s3_data:
  hf_cache:
