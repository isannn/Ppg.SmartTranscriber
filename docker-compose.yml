name: smarttranscriber

services:
  app:
    build:
      context: .
      dockerfile: src/SmartTranscriber.Api/Dockerfile
    container_name: smarttranscriber-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8460:8460"
    environment:
      ASPNETCORE_URLS: "http://+:8460"
      SmartTranscriber__ConnectionString: "${SMARTTRANSCRIBER__ConnectionString}"
      SmartTranscriber__Minio__Endpoint: "http://minio:9000"
      SmartTranscriber__Minio__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      SmartTranscriber__Minio__SecretKey: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      SmartTranscriber__Stt__SidecarUrl: "http://stt-svc:8461"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./smarttranscriber.json:/app/smarttranscriber.json:ro
    networks:
      - smarttranscriber

  stt-svc:
    build:
      context: tools/stt_svc
    container_name: smarttranscriber-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8461:8461"
    environment:
      STT_HOST: "0.0.0.0"
      STT_PORT: "8461"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - smarttranscriber

  minio:
    image: minio/minio:latest
    container_name: smarttranscriber-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:8463:9000"   # S3 API
      - "127.0.0.1:8462:9001"   # Console
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - smarttranscriber

networks:
  smarttranscriber:
    name: smarttranscriber_network

volumes:
  minio_data:
  hf_cache:
