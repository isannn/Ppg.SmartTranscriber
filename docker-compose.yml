services:
  postgres:
    image: postgres:16
    container_name: transcription_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_transcription
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: transcription_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  migrations:
    build:
      context: .
      dockerfile: Ppg.SmartTranscriber.Data/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__postgres: "Host=postgres;Port=5432;Database=db_transcription;Username=postgres;Password=postgres"
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: Ppg.SmartTranscriber.Api/Dockerfile
    container_name: transcription_api
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "8080:80"   # HTTP
      - "8081:443"  # HTTPS
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:80;https://+:443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: YourSecurePassword123!
      ConnectionStrings__postgres: "Host=postgres;Port=5432;Database=db_transcription;Username=postgres;Password=postgres"
      Minio__Endpoint: http://minio:9000
      Minio__AccessKey: minio
      Minio__SecretKey: minio123
      Minio__BucketName: transcription-audio
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets/aspnetcore-https:/https:ro

volumes:
  pgdata:
  minio_data: